version: '3.8'

# ============================================================
# docker-compose-scale.yml
# Scale experiment: 50 concurrent IoT devices
#   - 40 MQTT benign devices (192.168.1.11 - 192.168.1.50)
#   - 06 CoAP benign devices (192.168.1.51 - 192.168.1.56)
#   - 04 Attack devices     (10.0.0.11   - 10.0.0.14)
# 
# Run: docker compose -f docker-compose-scale.yml up -d
# Stop: docker compose -f docker-compose-scale.yml down
# ============================================================

networks:
  benign_net:
    ipam:
      config:
        - subnet: 192.168.1.0/24
  attack_net:
    ipam:
      config:
        - subnet: 10.0.0.0/24

services:
  # ─── BROKER ────────────────────────────────────────────────
  broker:
    image: eclipse-mosquitto:2.0
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      benign_net:
        ipv4_address: 192.168.1.5
      attack_net:
        ipv4_address: 10.0.0.5

  # ─── CoAP GATEWAY (listens for CoAP devices) ───────────────
  coap_server:
    build:
      context: .
      dockerfile: Dockerfile.coap
    environment:
      - ROLE=coap_server
    networks:
      benign_net:
        ipv4_address: 192.168.1.100
    ports:
      - "5683:5683/udp"

  # ─── 40 MQTT BENIGN DEVICES ────────────────────────────────
  benign_01:  { build: ., environment: [BROKER_IP=192.168.1.5, DEVICE_ID=benign_01,  ROLE=benign], networks: { benign_net: { ipv4_address: 192.168.1.11 } } }
  benign_02:  { build: ., environment: [BROKER_IP=192.168.1.5, DEVICE_ID=benign_02,  ROLE=benign], networks: { benign_net: { ipv4_address: 192.168.1.12 } } }
  benign_03:  { build: ., environment: [BROKER_IP=192.168.1.5, DEVICE_ID=benign_03,  ROLE=benign], networks: { benign_net: { ipv4_address: 192.168.1.13 } } }
